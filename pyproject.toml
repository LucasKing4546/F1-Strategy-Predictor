[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "f1strat"
version = "0.1.0"
description = "F1 race strategy predictor: top strategies, undercut windows and target lap times for a driver at any lap of a past race."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ipykernel>=6.29", "nbconvert>=7.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
